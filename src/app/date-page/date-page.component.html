<div>
  <button class="btn btn-outline-primary" type="button" (click)="dateSetting.getDayDate()" ><i class="bi bi-search"></i> Get Day Date</button>
  <button class="btn btn-outline-danger" type="button" (click)="dateSetting.resetDate()" ><i class="bi bi-arrow-clockwise"></i>Reset Date</button>
</div>
<br />

@if (dateSetting.isLoading) {
  <h3>Loading Spinner</h3>
} @else {
  <app-date-grid [dataSource]="dateSetting.dataSource"></app-date-grid>
}
