<button class="btn btn-primary" type="button" (click)="getDate()" >Get Date</button>
<button class="btn btn-warning" type="button" (click)="resetDate()" >Reset Date</button>
<br />

<table class="table">
  <thead>
    <tr>
        <th>Index</th>  
        <th>Day</th>  
        <th>Date</th>  
        <th>Time</th>  
    </tr>
  </thead>
  
  <tbody>

    @for (item of dateClassList; track $index) {
      <tr>
        <td> {{ $index }} </td>
        <td> {{ item.day }} </td>
        <td> {{ item.date }} </td>
        <td> {{ item.time  }} </td>
      </tr>
    }
  </tbody>
</table>
