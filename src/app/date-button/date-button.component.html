<div>
  <button class="btn btn-outline-primary" type="button" (click)="dateSetting.getDate()" ><i class="bi bi-search"></i> Get Date</button>
  <button class="btn btn-outline-primary" type="button" (click)="dateSetting.getDayDate()" ><i class="bi bi-search"></i> Get Day Date</button>
  <button class="btn btn-outline-danger" type="button" (click)="dateSetting.resetDate()" ><i class="bi bi-arrow-clockwise"></i>Reset Date</button>
</div>
<br />

<table class="table table-hover">
  <thead>
    <tr>
        <th>Index</th>  
        <th>Day</th>  
        <th>Date</th>  
        <th>Time</th>  
        <th>Temp</th>  
    </tr>
  </thead>
  
  <tbody>

    @for (item of dateSetting.dateClassList; track $index) {
      <tr>
        <td> {{ $index }} </td>
        <td> {{ item.day }} </td>
        <td> {{ item.date }} </td>
        <td> {{ item.time }} </td>
        <td> {{ item.temperature }} </td>
      </tr>
    }
  </tbody>
</table>
