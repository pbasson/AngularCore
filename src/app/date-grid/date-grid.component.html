<table class="table table-hover">
    <thead>
        <tr>        
            <th>Index</th>  
            <th>Day</th>  
            <th>Date</th>  
            <th>Time</th>  
            <th>Temp</th>  
        </tr>
    </thead>
    
    <tbody>
        @for (item of dataSource; track $index) {
        <tr>
            <td> {{ $index }} </td>
            <td> {{ item.day }} </td>
            <td> {{ item.date }} </td>
            <td> {{ item.time }} </td>
            <td> {{ item.temperature }} </td>
        </tr>
        }
    </tbody>
  </table>
